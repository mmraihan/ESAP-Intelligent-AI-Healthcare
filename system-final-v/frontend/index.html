<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ESAP Intelligent AI Healthcare — intake-time clinical decision support. Calibrated, explainable, fairness-audited." />
    <title>ESAP Intelligent AI Healthcare</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e27" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before first paint so a dark-mode user never sees a white flash.
      (function () {
        try {
          var m = localStorage.getItem("esap.theme") || "system";
          if (m !== "system") document.documentElement.setAttribute("data-theme", m);
          // Arabic applies only on the patient-facing routes (see src/i18n).
          var localised = /^\/(patient|welcome|login|signup|invite)(\/|$)/.test(location.pathname);
          if (localised && localStorage.getItem("esap.lang") === "ar") {
            document.documentElement.setAttribute("lang", "ar");
            document.documentElement.setAttribute("dir", "rtl");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
