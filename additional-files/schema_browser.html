<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIMIC-IV Schema Browser</title>
<style>
  :root {
    --bg:         #0D1117;
    --surface:    #161B22;
    --surface-2:  #1C2330;
    --border:     #2A3548;
    --text:       #CDD5E0;
    --text-hi:    #EAF0FA;
    --text-lo:    #64748B;
    --accent:     #3B82F6;

    --hosp:    #3B82F6;
    --icu:     #0EA5C4;
    --note:    #A78BFA;
    --ml:      #F59E0B;
    --nfiles:  #34D399;

    --badge-raw-bg:    rgba(100,116,139,.18);
    --badge-raw-fg:    #94A3B8;
    --badge-type-bg:   rgba(59,130,246,.14);
    --badge-type-fg:   #93C5FD;
    --badge-nfiles-bg: rgba(52,211,153,.14);
    --badge-nfiles-fg: #34D399;

    --radius: 7px;
    --font-ui:   "SF Pro Display","Segoe UI Variable","Inter",system-ui,sans-serif;
    --font-mono: "SF Mono","Cascadia Code","Fira Code",Consolas,monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:        #EDF0F7;
      --surface:   #FFFFFF;
      --surface-2: #F3F6FB;
      --border:    #CDD5E4;
      --text:      #2D3A52;
      --text-hi:   #101828;
      --text-lo:   #7A8AA8;
      --accent:    #2563EB;
      --badge-raw-bg:  rgba(100,116,139,.12);
      --badge-raw-fg:  #5A6882;
      --badge-type-bg: rgba(37,99,235,.10);
      --badge-type-fg: #2563EB;
      --badge-nfiles-bg: rgba(5,150,105,.12);
      --badge-nfiles-fg: #059669;
      --nfiles: #059669;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0D1117;--surface:#161B22;--surface-2:#1C2330;--border:#2A3548;
    --text:#CDD5E0;--text-hi:#EAF0FA;--text-lo:#64748B;--accent:#3B82F6;
    --badge-raw-bg:rgba(100,116,139,.18);--badge-raw-fg:#94A3B8;
    --badge-type-bg:rgba(59,130,246,.14);--badge-type-fg:#93C5FD;
    --badge-nfiles-bg:rgba(52,211,153,.14);--badge-nfiles-fg:#34D399;
    --nfiles:#34D399;
  }
  :root[data-theme="light"] {
    --bg:#EDF0F7;--surface:#FFFFFF;--surface-2:#F3F6FB;--border:#CDD5E4;
    --text:#2D3A52;--text-hi:#101828;--text-lo:#7A8AA8;--accent:#2563EB;
    --badge-raw-bg:rgba(100,116,139,.12);--badge-raw-fg:#5A6882;
    --badge-type-bg:rgba(37,99,235,.10);--badge-type-fg:#2563EB;
    --badge-nfiles-bg:rgba(5,150,105,.12);--badge-nfiles-fg:#059669;
    --nfiles:#059669;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  .header {
    position: sticky; top: 0; z-index: 50;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px 10px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  .header-title {
    font-size: 13px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-lo);
    white-space: nowrap;
  }
  .header-title span { color: var(--text-hi); }

  .search-wrap { position: relative; flex: 1 1 200px; max-width: 340px; }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; stroke: var(--text-lo); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  #search {
    width: 100%; padding: 7px 10px 7px 32px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text-hi);
    font-family: var(--font-ui); font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-lo); }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-btn {
    padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); background: transparent; color: var(--text-lo);
    cursor: pointer; transition: all .15s; letter-spacing: .02em;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--text-lo); }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn[data-schema="all"].active       { background: #3B6FD4; }
  .filter-btn[data-schema="mimic_hosp"].active{ background: var(--hosp); }
  .filter-btn[data-schema="mimic_icu"].active { background: var(--icu); }
  .filter-btn[data-schema="mimic_note"].active{ background: var(--note); }
  .filter-btn[data-schema="ml"].active        { background: var(--ml); color: #1a1000; }
  .filter-btn[data-schema="note_files"].active{ background: var(--nfiles); color: #05200f; }

  .toggle-raw {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-lo); cursor: pointer; user-select: none;
  }
  .toggle-raw input { cursor: pointer; }

  #count-bar {
    padding: 8px 20px; font-size: 12px; color: var(--text-lo);
    display: flex; gap: 16px;
  }
  #count-bar b { color: var(--text); }

  .grid {
    padding: 0 20px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
    align-items: start;
  }

  .tcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    border-top: 3px solid var(--schema-color, var(--border));
  }
  .tcard-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px 9px;
    cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .tcard-head:hover { background: var(--surface-2); }
  .tcard-name {
    font-family: var(--font-mono);
    font-size: 12.5px; font-weight: 600; color: var(--text-hi);
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .schema-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--schema-color, var(--border));
  }
  .badge {
    font-size: 10px; font-weight: 600; padding: 2px 6px;
    border-radius: 4px; letter-spacing: .03em; white-space: nowrap; flex-shrink: 0;
  }
  .badge-raw    { background: var(--badge-raw-bg);    color: var(--badge-raw-fg); }
  .badge-typed  { background: var(--badge-type-bg);   color: var(--badge-type-fg); }
  .badge-ml     { background: rgba(245,158,11,.15);    color: #F59E0B; }
  .badge-note   { background: rgba(167,139,250,.15);   color: #A78BFA; }
  .badge-nfiles { background: var(--badge-nfiles-bg);  color: var(--badge-nfiles-fg); }

  .col-count { font-size: 11px; color: var(--text-lo); flex-shrink: 0; }
  .chevron { font-size: 11px; color: var(--text-lo); flex-shrink: 0; transition: transform .15s; }
  .tcard.open .chevron { transform: rotate(90deg); }

  .tcard-body { display: none; }
  .tcard.open .tcard-body { display: block; }

  .source-path {
    padding: 6px 14px 5px;
    font-size: 10px; font-family: var(--font-mono);
    color: var(--text-lo); background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .col-table { width: 100%; border-collapse: collapse; }
  .col-table tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .col-table td { padding: 5px 14px; font-size: 12px; vertical-align: middle; }
  .col-table tr:hover td { background: var(--surface-2); }
  .col-name {
    font-family: var(--font-mono); color: var(--text);
    font-size: 11.5px; width: 55%;
  }
  .col-name.pk { color: var(--accent); }
  .col-type { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-lo); white-space: nowrap; }
  .col-null { font-size: 10px; color: var(--text-lo); text-align: right; }
  .nn { color: #F87171; font-size: 9px; letter-spacing: .05em; }

  #empty { display: none; padding: 60px 20px; text-align: center; color: var(--text-lo); }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; padding: 0 12px 30px; }
    .header { padding: 10px 12px; }
    #count-bar { padding: 6px 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">MIMIC-IV &nbsp;<span>Schema Browser</span></div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>

<div class="grid" id="grid"></div>

// ── Render ──
const grid    = document.getElementById('grid');
const empty   = document.getElementById('empty');
const search  = document.getElementById('search');
const hideRaw = document.getElementById('hide-raw');

let activeSchema = 'all';
let query = '';
let showRaw = true;

function buildCards() {
  grid.innerHTML = '';
  let tCount = 0, cCount = 0;
  const q = query.toLowerCase();

  DATA.forEach(t => {
    if (activeSchema !== 'all' && t.schema !== activeSchema) return;
    if (!showRaw && t.raw) return;

    const nameMatch = t.table.toLowerCase().includes(q);
    const colMatches = t.cols.filter(c => c[0].toLowerCase().includes(q));
    if (q && !nameMatch && colMatches.length === 0) return;

    const cols = q && !nameMatch ? colMatches : t.cols;
    tCount++;
    cCount += t.cols.length;

    const color = SCHEMA_COLOR[t.schema] || '#888';
    const div = document.createElement('div');
    div.className = 'tcard';
    div.style.setProperty('--schema-color', color);

    let badgeHtml = '';
    if (t.raw)    badgeHtml = `<span class="badge badge-raw">TEXT</span>`;
    if (t.typed)  badgeHtml = `<span class="badge badge-typed">TYPED</span>`;
    if (t.ml)     badgeHtml = `<span class="badge badge-ml">ML</span>`;
    if (t.nfiles) badgeHtml = `<span class="badge badge-nfiles">GZIP CSV</span>`;
    if (t.schema === 'mimic_note') badgeHtml = `<span class="badge badge-note">DB</span>`;

    const infoTag = t.note ? `<span class="badge badge-raw" style="font-size:9px;max-width:120px;overflow:hidden;text-overflow:ellipsis" title="${t.note}">${t.note}</span>` : '';

    const srcRow = t.src
      ? `<div class="source-path" title="${t.src}">${t.src}</div>`
      : '';

    div.innerHTML = `
      <div class="tcard-head">
        <div class="schema-dot"></div>
        <div class="tcard-name">${t.table}</div>
        ${badgeHtml}
        <div class="col-count">${cols.length}${cols.length < t.cols.length ? '/'+t.cols.length : ''} cols</div>
        <div class="chevron">&#9654;</div>
      </div>
      <div class="tcard-body">
        ${srcRow}
        <table class="col-table">
          ${cols.map(([name, type, nn]) => `
            <tr>
              <td class="col-name ${nn ? 'pk' : ''}">${highlight(name, q)}</td>
              <td class="col-type">${type}</td>
              <td class="col-null">${nn ? '<span class="nn">NOT NULL</span>' : ''}</td>
            </tr>`).join('')}
        </table>
      </div>`;

    div.querySelector('.tcard-head').addEventListener('click', () => {
      div.classList.toggle('open');
    });

    if (q) div.classList.add('open');
    grid.appendChild(div);
  });

  document.getElementById('tbl-count').textContent = tCount;
  document.getElementById('col-count').textContent = cCount;
  empty.style.display = tCount === 0 ? 'block' : 'none';
  grid.style.display  = tCount === 0 ? 'none' : '';
}

function highlight(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return text;
  return text.slice(0,i)
    + `<mark style="background:rgba(59,130,246,.35);border-radius:2px;color:inherit">${text.slice(i,i+q.length)}</mark>`
    + text.slice(i+q.length);
}

search.addEventListener('input', () => { query = search.value.trim(); buildCards(); });
hideRaw.addEventListener('change', () => { showRaw = !hideRaw.checked; buildCards(); });

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSchema = btn.dataset.schema;
    buildCards();
  });
});

buildCards();
</script>
